<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#12151D" />
      <stop offset="70%" stop-color="#08090C" />
      <stop offset="100%" stop-color="#040507" />
    </radialGradient>

    <!-- Warm Amber Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="40%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>

    <!-- Cyan Energy Core Gradient -->
    <radialGradient id="cyanCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#70F7FF" />
      <stop offset="75%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00838F" />
    </radialGradient>

    <!-- Outer Rim Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Mask Background -->
  <clipPath id="circleClip">
    <circle cx="400" cy="400" r="390" />
  </clipPath>

  <g clip-path="url(#circleClip)">
    <!-- Base Canvas -->
    <rect width="800" height="800" fill="url(#bgGrad)" />

    <!-- Outer Contrast Rim (Guarantees separation in YouTube Dark Mode and Light Mode) -->
    <circle cx="400" cy="400" r="380" fill="none" stroke="#00E5FF" stroke-opacity="0.3" stroke-width="3" />
    <circle cx="400" cy="400" r="372" fill="none" stroke="#FFB300" stroke-opacity="0.2" stroke-width="1.5" />

    <!-- Ring 4: Outermost Labyrinth Wall (Radius ~320) -->
    <path d="M 720 400 A 320 320 0 1 0 400 720" fill="none" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round" />
    <path d="M 80 400 A 320 320 0 0 0 330 88" fill="none" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round" />

    <!-- Ring 3: Middle Labyrinth Aperture Wall (Radius ~240) -->
    <path d="M 400 160 A 240 240 0 1 1 160 400" fill="none" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round" />
    <path d="M 230 570 A 240 240 0 0 0 640 400" fill="none" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round" />

    <!-- Ring 2: Inner Aperture Wall (Radius ~160) -->
    <path d="M 560 400 A 160 160 0 1 0 400 560" fill="none" stroke="url(#goldGrad)" stroke-width="28" stroke-linecap="round" />
    <path d="M 255 332 A 160 160 0 0 1 513 287" fill="none" stroke="url(#goldGrad)" stroke-width="28" stroke-linecap="round" />

    <!-- Intersecting Aperture Spoke Blades (Radial Iris Geometry) -->
    <line x1="400" y1="240" x2="400" y2="160" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round" />
    <line x1="560" y1="400" x2="640" y2="400" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round" />
    <line x1="400" y1="640" x2="400" y2="720" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round" />
    <line x1="160" y1="400" x2="80" y2="400" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round" />

    <!-- Ring 1: The Core Containment Chamber (Radius ~95) -->
    <circle cx="400" cy="400" r="92" fill="none" stroke="#00E5FF" stroke-width="12" stroke-opacity="0.9" />
    <circle cx="400" cy="400" r="92" fill="none" stroke="#FFB300" stroke-width="6" stroke-dasharray="35 25" />

    <!-- Center Cognitive Core Glow -->
    <circle cx="400" cy="400" r="56" fill="url(#cyanCore)" filter="url(#glow)" />
    <circle cx="400" cy="400" r="22" fill="#FFFFFF" />
  </g>
</svg>
